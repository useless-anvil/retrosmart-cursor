# Master color schemes definition
#
# Each scheme specifies:
#   name:     Display name used in index.theme
#   name_es:  Optional Spanish display name (defaults to name)
#   outline:  Outline color (replaces cyan #00FFFF in xpm sources)
#   fill:     Fill color (replaces coral #FF7F50 in xpm sources)
#   cursors:  Which src/base/<style>/ folder to use for cursor artwork

mac-ish-catppucin:
  name: "CATPPUCCIN (Mac-ish)"
  outline: "#1e1e2e"
  fill: "#cdd6f4"
  cursors: "mac-ish"

mac-ish-everforest:
  name: "EVERFOREST (Mac-ish)"
  outline: "#2d353b"
  fill: "#d3c6aa"
  cursors: "mac-ish"

mac-ish-gruvbox:
  name: "GRU[V]BOX (Mac-ish)"
  outline: "#282828"
  fill: "#ebdbb2"
  cursors: "mac-ish"

mac-ish-inverted:
  name: "INVERTED (Mac-ish)"
  outline: "#FFFFFF"
  fill: "#000000"
  cursors: "mac-ish"

mac-ish-classic:
  name: "Classic (Mac-ish)"
  outline: "#000000"
  fill: "#FFFFFF"
  cursors: "mac-ish"

mac-ish-rose_pine:
  name: "ROSE PINE (Mac-ish)"
  outline: "#191724"
  fill: "#e0def4"
  cursors: "mac-ish"

mac-ish-solarized_dark:
  name: "SOLARIZED DARK (Mac-ish)"
  outline: "#002b36"
  fill: "#93a1a1"
  cursors: "mac-ish"

