# Master color schemes definition
#
# Each scheme specifies:
#   name:     Display name used in index.theme
#   outline:  Outline color (replaces cyan #00FFFF in xpm sources)
#   fill:     Fill color (replaces coral #FF7F50 in xpm sources)
#   cursors:  Which src/<style>/ folder to use for cursor artwork

mac-ish-catppucin:
  name: "CATPPUCCIN (Mac-ish)"
  outline: "#cdd6f4"
  fill: "#1e1e2e"
  cursors: "mac-ish"

mac-ish-everforest:
  name: "EVERFOREST (Mac-ish)"
  outline: "#d3c6aa"
  fill: "#2d353b"
  cursors: "mac-ish"

mac-ish-gruvbox:
  name: "GRU[V]BOX (Mac-ish)"
  outline: "#ebdbb2"
  fill: "#282828"
  cursors: "mac-ish"

mac-ish-inverted:
  name: "INVERTED (Mac-ish)"
  outline: "#000000"
  fill: "#FFFFFF"
  cursors: "mac-ish"

mac-ish-classic:
  name: "Classic (Mac-ish)"
  outline: "#FFFFFF"
  fill: "#000000"
  cursors: "mac-ish"

mac-ish-rose_pine:
  name: "ROSE PINE (Mac-ish)"
  outline: "#e0def4"
  fill: "#191724"
  cursors: "mac-ish"

mac-ish-solarized_dark:
  name: "SOLARIZED DARK (Mac-ish)"
  outline: "#93a1a1"
  fill: "#002b36"
  cursors: "mac-ish"

mac-ish-violet:
  name: "VIOLET (Mac-ish)"
  outline: "#8563c5"
  fill: "#000000"
  cursors: "mac-ish"

