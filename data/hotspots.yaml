# hotspots.yaml -- one entry per cursor, tweak x/y to move the click point
#
# x, y   = pixel offset from the top-left of the source art (0,0 = top-left
#          corner). All source art is 32px; see SOURCE_SIZE in
#          data/hotspots_lib.py if that ever stops being true.
# delay  = frame delay in ms, only meaningful for animated cursors
#          (progress, wait, and win-3d not-allowed)
#
# Each cursor's `hotspots` map is keyed by style name (mac-ish, win-ish,
# cur-font, win-3d, ...), with "all" as the fallback for styles that don't
# have their own entry:
#
#   - cursor: pointer
#     hotspots:
#       all:      {x: 3, y: 0}   # mac-ish (and any future style) uses this
#       win-ish:  {x: 5, y: 0}   # unless it has its own line below
#       cur-font: {x: 0, y: 2}
#
# A style's entry only needs the keys that differ from "all" -- e.g.
# {win-ish: {delay: 120}} inherits x/y from "all" and only overrides delay.
# Cursors with no style-specific quirks just get `all` and nothing else.
#
# Cursors are grouped under headings just for readability; the group names
# themselves aren't read by the build, only "cursor" and "hotspots" are.

Basic / System:
  - cursor: default
    hotspots: {all: {x: 0, y: 0}}

  - cursor: pointer
    hotspots:
      all: {x: 3, y: 0}
      win-ish: {x: 5, y: 0}
      cur-font: {x: 0, y: 2}
      win-3d: {x: 8, y: 0}

  - cursor: context-menu
    hotspots: {all: {x: 0, y: 0}}

  - cursor: help
    hotspots:
      all: {x: 0, y: 0}
      cur-font: {x: 5, y: 14}

  - cursor: progress
    hotspots:
      all: {x: 0, y: 0, delay: 50}
      win-ish: {delay: 120}

  - cursor: wait
    hotspots: {all: {x: 12, y: 12, delay: 120}}

Text:
  - cursor: text
    hotspots:
      all: {x: 4, y: 9}
      win-3d: {x: 0, y: 5}

  - cursor: vertical-text
    hotspots:
      all: {x: 8, y: 4}
      win-3d: {x: 14, y: 0}

Select / Edit / Draw:
  - cursor: cell
    hotspots: {all: {x: 7, y: 6}}

  - cursor: crosshair
    hotspots: {all: {x: 7, y: 7}}

  - cursor: color-picker
    hotspots: {all: {x: 1, y: 16}}

  - cursor: draft
    hotspots: {all: {x: 0, y: 17}}

  - cursor: pencil
    hotspots:
      all: {x: 0, y: 19}
      win-ish: {x: 0, y: 0}
      win-3d: {x: 0, y: 0}

  - cursor: zoom-in
    hotspots: {all: {x: 5, y: 5}}

  - cursor: zoom-out
    hotspots: {all: {x: 5, y: 5}}

Drag and Drop:
  - cursor: copy
    hotspots: {all: {x: 9, y: 2}}

  - cursor: dnd-move
    hotspots: {all: {x: 0, y: 0}}

  - cursor: dnd-no-drop
    hotspots:
      all: {x: 8, y: 8}
      win-3d: {x: 11, y: 11}

  - cursor: no-drop
    hotspots: {all: {x: 0, y: 0}}

  - cursor: not-allowed
    hotspots:
      all: {x: 8, y: 8}
      win-ish: {x: 10, y: 10}
      win-3d: {x: 15, y: 15, delay: 120}

  - cursor: alias
    hotspots: {all: {x: 0, y: 0}}

Grab / Pan:
  - cursor: openhand
    hotspots:
      all: {x: 9, y: 6}

  - cursor: closedhand
    hotspots:
      all: {x: 9, y: 2}

  - cursor: fleur
    hotspots:
      all: {x: 7, y: 7}
      win-ish: {x: 9, y: 9}
      win-3d: {x: 10, y: 10}

  - cursor: all-scroll
    hotspots:
      all: {x: 7, y: 7}
      win-ish: {x: 9, y: 9}
      win-3d: {x: 9, y: 9}

Edge Resize:
  - cursor: top_side
    hotspots:
      all: {x: 7, y: 0}

  - cursor: bottom_side
    hotspots:
      all: {x: 7, y: 24}

  - cursor: left_side
    hotspots:
      all: {x: 0, y: 7}
      win-3d: {x: 24, y: 9}    

  - cursor: right_side
    hotspots:
      all: {x: 23, y: 7}
      win-3d: {x: 0, y: 9} 

Corner Resize:
  - cursor: top_left_corner
    hotspots:
      all: {x: 0, y: 0}
      win-3d: {x: 18, y: 4}

  - cursor: top_right_corner
    hotspots:
      all: {x: 22, y: 0}
      win-3d: {x: 2, y: 4}

  - cursor: bottom_left_corner
    hotspots:
      all: {x: 0, y: 22}
      win-3d: {x: 18, y: 4}

  - cursor: bottom_right_corner
    hotspots:
      all: {x: 23, y: 23}
      win-3d: {x: 2, y: 4}

Generic Resize / Split:
  - cursor: size_hor
    hotspots:
      all: {x: 7, y: 3}
      win-ish: {x: 9, y: 4}
      cur-font: {x: 8, y: 4}
      win-3d: {x: 9, y: 4}

  - cursor: size_ver
    hotspots:
      all: {x: 3, y: 7}
      win-ish: {x: 4, y: 9}
      cur-font: {x: 4, y: 8}
      win-3d: {x: 4, y: 9}

  - cursor: size_bdiag
    hotspots:
      all: {x: 6, y: 6}
      win-ish: {x: 7, y: 7}
      win-3d: {x: 7, y: 7}

  - cursor: size_fdiag
    hotspots:
      all: {x: 6, y: 6}
      win-ish: {x: 7, y: 7}
      win-3d: {x: 7, y: 7}

  - cursor: col-resize
    hotspots:
      all: {x: 8, y: 7}
      win-ish: {x: 9, y: 8}
      cur-font: {x: 8, y: 4}

  - cursor: row-resize
    hotspots:
      all: {x: 7, y: 7}
      win-ish: {x: 7, y: 9}

Directional Arrows:
  - cursor: up-arrow
    hotspots: {all: {x: 4, y: 0}}

  - cursor: down-arrow
    hotspots:
      all: {x: 4, y: 15}
      win-ish: {x: 4, y: 18}
      win-3d: {x: 4, y: 18}

  - cursor: left-arrow
    hotspots: {all: {x: 0, y: 4}}

  - cursor: right-arrow
    hotspots:
      all: {x: 15, y: 4}
      win-ish: {x: 18, y: 4}
      win-3d: {x: 18, y: 4}

Misc:
  - cursor: center_ptr
    hotspots: {all: {x: 5, y: 0}}

  - cursor: right_ptr
    hotspots:
      all: {x: 10, y: 0}
      win-3d: {x: 9, y: 0}

  - cursor: pirate
    hotspots: {all: {x: 12, y: 15}}

  - cursor: x-cursor
    hotspots: {all: {x: 7, y: 7}}

  - cursor: wayland-cursor
    hotspots: {all: {x: 8, y: 4}}
