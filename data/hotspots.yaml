# hotspots.yaml -- one entry per cursor, tweak x/y to move the click point
#
# x, y      = pixel offset from the top-left of the 32px image (0,0 = top-left corner)
# delay     = frame delay in ms, only needed for animated cursors (progress, wait)
# overrides = optional, per-style overrides of any of x/y/delay when a style's
#             art needs different values than the default (e.g. {win-ish: {x: 5, y: 0}}
#             or {win-ish: {delay: 120}}). Only the given style(s) are affected;
#             everything else still uses the top-level value(s).
#
# Cursors are grouped under headings just for readability; the group names
# themselves aren't read by the build, only "name/size/x/y/file/delay" are.

Basic / System:
  - {name: default,       size: 32, x:  0, y:  0, file: 32-default.png}
  - {name: pointer,       size: 32, x:  3, y:  0, file: 32-pointer.png, overrides: {win-ish: {x: 5, y: 0}}}
  - {name: context-menu,  size: 32, x:  0, y:  0, file: 32-context-menu.png}
  - {name: help,          size: 32, x:  0, y:  0, file: 32-help.png}
  - {name: progress,      size: 32, x:  0, y:  0, file: 32-progress1.png, delay: 50, overrides: {win-ish: {delay: 120}}}
  - {name: wait,          size: 32, x: 12, y: 12, file: 32-wait01.png,    delay: 120}

